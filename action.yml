name: "Verging Memory CI"
description: "Submits a release of your memory product to Verging Memory CI and commits its report when it is ready."
author: "Verging Labs"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  api_key:
    description: "Your Verging Memory CI API key, issued at onboarding. Pass it from a repository secret."
    required: true
  agent_setups:
    description: "The agent setup(s) to test, as you named them at onboarding. One name or several, separated with commas and/or newlines. Omit to use the account defaults."
    required: false
    default: ""
  activation_id:
    description: "Activation id from your setup or previous report. Use it to start onboarding or set up new test suites. Leave empty to use the current setup for a delivered agent setup."
    required: false
    default: ""
  environments:
    description: "Removed. Use agent_setups. If this legacy input is present, the Action stops with a migration error."
    required: false
    default: ""
  suites:
    description: "Comma separated test suite values, e.g. core-recall,truth-maintenance. Omit it (the default) to run all the suites chosen for your account and set up on every named agent setup (several setups run their intersection); set specific values to scope a release to those suites."
    required: false
    default: ""
  vendor_version:
    description: "The identifier of the release to test. Default: the VERSION file at the repository root, else the short commit SHA."
    required: false
    default: ""
  api_base:
    description: "Base URL of the Verging Memory CI API."
    required: false
    default: "https://ci.verginglabs.com"
  folder:
    description: "Name of the report folder at the repository root."
    required: false
    default: "Verging Memory CI"
  product_name:
    description: "Your product's name as it should appear on the report. Letters, digits, spaces, dots, underscores, plus signs, and hyphens only; single spaces between words, none at the start or the end; up to 64 characters; must not start with a hyphen."
    required: false
    default: ""
  fetch_only_release_id:
    description: "Fetch and commit the report of this existing release id without submitting anything. Use it to recover a job that failed after submitting; the id is in that job's log. A job that ended before its report was ready needs no recovery: the release is on record as pending in the report folder, and the next job (or a mode: sync job) commits the report once it is ready."
    required: false
    default: ""
  wiring_check:
    description: "Set to \"true\" to perform the free wiring check instead of a release: the Action submits a wiring check, commits its page into the report folder exactly like a report, and the job passes. Nothing is tested and nothing is billed. Not needed for the first push: while the test suites on your agent setups are not set up yet, every release is turned into a wiring check on its own and the job passes. Do not combine it with fetch_only_release_id or mode: sync."
    required: false
    default: "false"
  mode:
    description: "`release` (the default) submits a release and collects its report. `sync` submits nothing and collects any reports now ready for releases already in the report folder: the preliminary report of a release an earlier job stopped waiting for (recorded in releases/pending.json), and the final report of a release still on its preliminary report, which it replaces. In sync mode no environment is needed; do not combine it with fetch_only_release_id."
    required: false
    default: "release"
  fallback_pull_request:
    description: "Set to \"true\" to have a report commit whose push to the branch the job ran on was refused delivered on the branch verging-memory-ci/reports with a pull request into the repository's default branch, with the job staying green. Off by default: a refused push fails the job with an error that names the branch and the push permission the workflow's token needs, and the Action writes no other branch and opens no pull request. Never applies to a wiring check, whose page must land on the branch the job ran on."
    required: false
    default: "false"
  idempotency_key:
    description: "The Idempotency-Key the release is submitted under. Leave it empty (the default) to derive it from the workflow run (repository, commit SHA and run id): a re-run of the same workflow run then reuses the release it already submitted and is not charged twice, while a new commit or a new workflow run is a new release. Set it to submit under your own key; the same key with the same inputs reuses that release, the same key with changed inputs fails the job before anything is billed."
    required: false
    default: ""
  poll_timeout_minutes:
    description: "By default the job does not wait for the report: it checks once whether the report is ready, and then ends. If it is ready, the job commits it. If testing has already failed, the job fails. Otherwise the job ends green with the verdict `Pending`, and the report is committed once it is ready by the next job on any push, or by running the Action with `mode: sync`. Set `poll_timeout_minutes` to a number of minutes to have the job wait for the report instead (a waiting job spends GitHub Actions minutes)."
    required: false
    default: "0"

outputs:
  release_id:
    description: "The id of the release whose report this run fetched, or of the wiring check this run performed."
    value: ${{ steps.finish.outputs.release_id }}
  verdict:
    description: "The Release verdict from the report header: Ready, or Not ready with the reason. \"Wiring check\" when this run performed the wiring check instead of a release (nothing was tested; not a verdict). \"Pending\" when the report was not ready when the job ended (after its single check, or after poll_timeout_minutes when set): the release is on record as pending and a later job commits the report."
    value: ${{ steps.finish.outputs.verdict }}
  report_path:
    description: "Repository relative path of the committed REPORT.md for this release, or of the wiring check's page. Empty when the verdict is Pending: the report is not in the repository yet."
    value: ${{ steps.finish.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Resolve inputs
      shell: bash
      env:
        VERGING_API_KEY: ${{ inputs.api_key }}
        VERGING_AGENT_SETUPS: ${{ inputs.agent_setups }}
        VERGING_ACTIVATION_ID: ${{ inputs.activation_id }}
        VERGING_LEGACY_ENVIRONMENTS: ${{ inputs.environments }}
        VERGING_SUITES: ${{ inputs.suites }}
        VERGING_VENDOR_VERSION: ${{ inputs.vendor_version }}
        VERGING_API_BASE: ${{ inputs.api_base }}
        VERGING_FOLDER: ${{ inputs.folder }}
        VERGING_PRODUCT_NAME: ${{ inputs.product_name }}
        VERGING_FETCH_ONLY_RELEASE_ID: ${{ inputs.fetch_only_release_id }}
        VERGING_WIRING_CHECK: ${{ inputs.wiring_check }}
        VERGING_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        VERGING_POLL_TIMEOUT_MINUTES: ${{ inputs.poll_timeout_minutes }}
        VERGING_FALLBACK_PULL_REQUEST: ${{ inputs.fallback_pull_request }}
        VERGING_MODE: ${{ inputs.mode }}
      run: '"$GITHUB_ACTION_PATH/scripts/resolve_inputs.sh"'

    - name: Reconcile earlier reports
      shell: bash
      env:
        VERGING_API_KEY: ${{ inputs.api_key }}
        VERGING_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/reconcile.sh"'

    - name: Submit the release and collect the report
      if: ${{ inputs.mode != 'sync' }}
      shell: bash
      env:
        VERGING_API_KEY: ${{ inputs.api_key }}
      run: '"$GITHUB_ACTION_PATH/scripts/run_release.sh"'

    # Runs unless the job was cancelled: a release the job stopped waiting
    # for, or one whose report could not be fetched after the receipt, is
    # committed as pending so a later job collects its report.
    - name: Commit and push the report
      if: ${{ !cancelled() && inputs.mode != 'sync' }}
      shell: bash
      env:
        VERGING_API_KEY: ${{ inputs.api_key }}
        VERGING_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/commit_push.sh"'

    - name: Post the check and the pull request comment
      if: ${{ inputs.mode != 'sync' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$GITHUB_ACTION_PATH/scripts/surfaces.sh"'

    - name: Set outputs and check the report is complete
      id: finish
      if: ${{ inputs.mode != 'sync' }}
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/set_outputs.sh"'
